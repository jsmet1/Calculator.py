# Simple Calculator Program



# This program performs basic arithmetic operations: addition, subtraction, multiplication, and division.



def calculate():

    # Get the first number from the user

    num1 = float(input("Enter the first number: "))

    

    # Get the second number from the user

    num2 = float(input("Enter the second number: "))

    

    # Get the arithmetic operation the user wants to perform

    operation = input("Choose an operation (addition, subtraction, multiplication, division): ").lower()

    

    # Check which operation to perform

    if operation == "addition":

        # Perform addition

        result = num1 + num2

        print(f"The result of adding {num1} and {num2} is {result}")



    elif operation == "subtraction":

        # Perform subtraction

        result = num1 - num2

        print(f"The result of subtracting {num2} from {num1} is {result}")



    elif operation == "multiplication":

        # Perform multiplication

        result = num1 * num2

        print(f"The result of multiplying {num1} and {num2} is {result}")



    elif operation == "division":

        # Check for division by zero

        if num2 == 0:

            print("Error: Division by zero is not allowed.")

        else:

            # Perform division

            result = num1 / num2

            print(f"The result of dividing {num1} by {num2} is {result}")



    else:

        # Handle invalid operation input

        print("Error: Invalid operation. Please choose from addition, subtraction, multiplic, or division.")



# Start the calculator program

